name: Deploy to GitHub Pages

on:
  # main dalına her gönderimde site yeniden yayınlanır.
  push:
    branches: [main]
  # GitHub'daki Actions sekmesinden elle de çalıştırılabilir.
  workflow_dispatch:

# Deponun okunması ve Pages'e yayın yapılması için gereken izinler.
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda yalnızca bir yayın işlemi çalışsın.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v7

      - name: Bağımlılıkları kur, siteyi derle ve yükle
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v5
